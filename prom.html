<!DOCTYPE html>
<html>
<head>
    <title>Advanced Js</title>
</head>
<body>
<script>
    let complete = true;

    function promise(){
        return new Promise(function(resolve,reject){
            if(complete){
                resolve("I am success");
            }else{
                reject("I am failes");
            }
        });
    }

    let result = promise();
    console.log(result);
</script>
</body>
</html>
